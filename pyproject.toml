[project]
name = "curlmock"
version = "0.1.0"
description = "Instant mock API server from a cURL command"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "etailup" }]
keywords = ["mock", "api", "curl", "devtools", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "flask>=3.0",
]

[project.scripts]
curlmock = "curlmock.cli:main"

[project.urls]
Homepage = "https://github.com/etailup/curlmock"
Repository = "https://github.com/etailup/curlmock"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curlmock"]
